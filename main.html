<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kakos 2027 🍼</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="container card">
      <span class="subtitle fade-in delay-1">🌱 Máme pro Vás novinku!</span>

      <h1 class="fade-in delay-2">1+1=3</h1>

      <div class="image-wrapper fade-in delay-3">
        <img src="images/mimi.jpg" alt="Očekávání" class="hero-image" />
      </div>

      <p class="announcement fade-in delay-4">Čekáme nového člena rodiny! 🤍</p>

      <p class="due-date fade-in delay-5">Odhadovaný termín: 10. května 2027</p>

      <div class="countdown fade-in delay-6" id="countdown">
        <div class="time-box">
          <span id="days">0</span>
          <label>Dní</label>
        </div>
        <div class="time-box">
          <span id="hours">0</span>
          <label>Hodin</label>
        </div>
        <div class="time-box">
          <span id="minutes">0</span>
          <label>Minut</label>
        </div>
        <div class="time-box">
          <span id="seconds">0</span>
          <label>Sekund</label>
        </div>
      </div>

      <!-- 
      <div class="names-cloud fade-in delay-7">
        <span class="name-tag n-1">Matyáš 🧸</span>
        <span class="name-tag n-2">Sofie 🌸</span>
        <span class="name-tag n-3">Jáchym 🦖</span>
        <span class="name-tag n-4">Izabela 🚀</span>
        <span class="name-tag n-5">Ema 🍯</span>
        <span class="name-tag n-6">Kryštof 🎸</span>
       -->
      </div>
    </main>
  </body>
</html>
